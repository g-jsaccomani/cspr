apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: cspr-prereq-job
  labels:
    cloud.googleapis.com/location: us-east1
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: cspr-prereq-cloudrun-sa@nu-cspr-assessment.iam.gserviceaccount.com
          containers:
          - image: us-east1-docker.pkg.dev/nu-cspr-assessment/customer-cspr-toolkit/cspr-prereq:latest
            env:
            - name: BQ_PROJECT
              value: "nu-cspr-assessment"
            - name: BQ_PROJECT_ID
              value: "nu-cspr-assessment"
            - name: ORGANIZATION_ID
              value: "802070535070"
            - name: LOCATION
              value: "us-east1"
            - name: GCP_GROUP_EMAIL_ADDRESS
              value: "jsaccomani@google.com"
            - name: BQDATASET_INVENTORY
              value: "cspr_cai"
            - name: BQDATASET_FINDING
              value: "cspr_finding"
            - name: BQDATASET_POLICYANALYZER
              value: "cspr_policy"
            - name: BQDATASET_REC
              value: "cspr_rec"
            - name: BQDATASET_CLOUDIDENTITY
              value: "cspr_ci"
            - name: ENABLE_CAI
              value: "TRUE"
            - name: ENABLE_ORGPOLICY
              value: "TRUE"
            - name: ENABLE_RECOMMENDER_EXPORT
              value: "TRUE"
            - name: ENABLE_SAKEY_ANALYZER
              value: "TRUE"
            - name: ENABLE_CLOUD_IDENTITY
              value: "FALSE"
            resources:
              limits:
                cpu: "2000m"
                memory: "4Gi"
          timeoutSeconds: 3600
          maxRetries: 1
